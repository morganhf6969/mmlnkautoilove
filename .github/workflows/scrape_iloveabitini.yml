name: 🔄 Scrape @iloveabitini

on:
  workflow_dispatch:
    # Solo manuale — lo scraping automatico gira sul VPS IONOS via cron
    # (GitHub Actions usa IP AWS/Azure che Instagram blocca)

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: 📦 Installa dipendenze
        run: pip install -r scripts/requirements.txt

      - name: 🕷️ Esegui scraper
        id: scraper
        env:
          INSTAGRAM_SESSION: ${{ secrets.INSTAGRAM_SESSION }}
        run: |
          output=$(python scripts/scraper.py)
          echo "$output"
          echo "$output" >> $GITHUB_OUTPUT

      - name: 📝 Commit feed aggiornato
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/iloveabitini_feed.json
          if git diff --staged --quiet; then
            echo "✅ Nessun nuovo post."
          else
            TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
            git commit -m "🔄 Feed @iloveabitini aggiornato [$TIMESTAMP]"
            git push
            echo "✅ Feed committato."
          fi
